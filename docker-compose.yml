services:
  postgres:
    image: postgres:16
    container_name: qasim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qasim_platform
      POSTGRES_USER: qasim
      POSTGRES_PASSWORD: qasim123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
    container_name: qasim-backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://qasim:qasim123@postgres:5432/qasim_platform
      PORT: 5000

  frontend:
    build:
      context: ./apps/frontend
    container_name: qasim-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api

volumes:
  postgres_data:
